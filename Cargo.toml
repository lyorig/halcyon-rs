[package]
name = "halcyon"
version = "0.1.0"
edition = "2024"

# Disables testing `src/lib.rs`, since there are no tests there.
# The actual tests are located in `test/` (see [[test]] below).
[lib]
test = false

[dependencies]
bitmask-enum = "2.2.5"
paste = "1.0.15"
sdl3-sys = "0.6.5"
sdl3-ttf-sys = "0.6.0"

[dev-dependencies]
rustest = "0.3.1"

[[test]]
name = "clipboard"
harness = false

[[test]]
name = "color"
harness = false

[[test]]
name = "error"
harness = false

[[test]]
name = "event"
harness = false

[[test]]
name = "init"
harness = false

[[test]]
name = "log"
harness = false

[[test]]
name = "properties"
harness = false

[[test]]
name = "texture"
harness = false

[[test]]
name = "ttf"
harness = false
